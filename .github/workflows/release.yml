name: Release

# Publishes to npm when a version tag is pushed (`git tag v0.1.0 && git push origin v0.1.0`).
# Authentication is npm Trusted Publishing: the package's settings on npmjs.com name this
# repository and this workflow file as a trusted publisher, and `id-token: write` lets the job
# prove itself to npm with an OpenID Connect token, which also signs the package with a
# provenance statement. No npm token is needed or used.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check:plugin-versions
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run verify:package
      # Trusted Publishing needs npm 11.5.1 or later; the npm bundled with Node 24 may be older.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
