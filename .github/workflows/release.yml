name: Release

# Publishes to npm when a version tag is pushed (`git tag v0.1.0 && git push origin v0.1.0`).
# Needs the NPM_TOKEN secret (an npm automation token for the `openteleport` package, set on the
# repository or the organization). `id-token: write` lets npm sign the package with a provenance
# statement that links it to this workflow run.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
